<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire de Filaments 3D</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background: #121212; color: #e0e0e0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; }
    h1 { text-align: center; margin-bottom: 20px; color: #00bcd4; }
    h2 { margin-bottom: 15px; color: #00bcd4; font-size: 1.2rem; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 15px; }
    input, select { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    
    button { background: #00bcd4; color: #121212; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 12px; }
    button:hover { background: #00acc1; }
    .btn-secondary { background: #333; color: #ccc; }
    .btn-secondary:hover { background: #444; }
    .btn-danger { background: #cf6679; color: #000; font-size: 13px; padding: 6px 12px; width: auto; margin: 0; }
    .btn-logout { background: #d32f2f; color: #fff; margin-top: 25px; }

    .hidden { display: none; }
    .error { color: #cf6679; font-size: 14px; margin-top: 10px; text-align: center; }
    
    .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    ul { list-style: none; margin-top: 15px; }
    li { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #00bcd4; }
    .filament-info { display: flex; flex-direction: column; gap: 4px; }
    .filament-title { font-weight: bold; font-size: 1.1rem; color: #fff; }
    .filament-details { font-size: 0.85rem; color: #aaa; }
  </style>

  <!-- SDKs Firebase v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBNrwgL4nU-22mbj2osMG8oDvIgFYMPoYM",
      authDomain: "gestion-filaments.firebaseapp.com",
      projectId: "gestion-filaments",
      storageBucket: "gestion-filaments.firebasestorage.app",
      messagingSenderId: "695424025301",
      appId: "1:695424025301:web:fc6efb031efbdd3796185c",
      measurementId: "G-W35PK3TSDY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Éléments du DOM
    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const authTitle = document.getElementById('auth-title');
    const authBtn = document.getElementById('auth-btn');
    const toggleAuthBtn = document.getElementById('toggle-auth-btn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authError = document.getElementById('auth-error');
    const userEmailSpan = document.getElementById('user-email');
    const logoutBtn = document.getElementById('logout-btn');

    const brandInput = document.getElementById('brand-input');
    const typeSelect = document.getElementById('type-select');
    const colorInput = document.getElementById('color-input');
    const weightInput = document.getElementById('weight-input');
    const addFilamentBtn = document.getElementById('add-filament-btn');
    const filamentsList = document.getElementById('filaments-list');

    let isSignUp = false;

    // Basculer Connexion / Inscription
    toggleAuthBtn.addEventListener('click', () => {
      isSignUp = !isSignUp;
      authTitle.textContent = isSignUp ? "Créer un compte" : "Connexion";
      authBtn.textContent = isSignUp ? "S'inscrire" : "Se connecter";
      toggleAuthBtn.textContent = isSignUp ? "Déjà un compte ? Connecte-toi" : "Pas de compte ? S'inscrire";
      authError.textContent = "";
    });

    // Action Authentification
    authBtn.addEventListener('click', async () => {
      const email = emailInput.value;
      const password = passwordInput.value;
      authError.textContent = "";

      try {
        if (isSignUp) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        authError.textContent = "Erreur : " + err.message;
      }
    });

    // Déconnexion
    logoutBtn.addEventListener('click', () => signOut(auth));

    // Suivi de l'état utilisateur
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmailSpan.textContent = user.email;
        authSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        chargerFilaments(user.uid);
      } else {
        authSection.classList.remove('hidden');
        appSection.classList.add('hidden');
        filamentsList.innerHTML = "";
      }
    });

    // Ajouter un filament lié à l'utilisateur
    addFilamentBtn.addEventListener('click', async () => {
      const brand = brandInput.value.trim();
      const type = typeSelect.value;
      const color = colorInput.value.trim();
      const weight = weightInput.value;
      const user = auth.currentUser;

      if (brand && color && weight && user) {
        await addDoc(collection(db, "filaments"), {
          brand: brand,
          type: type,
          color: color,
          weightGrams: Number(weight),
          userId: user.uid,
          createdAt: new Date()
        });

        // Réinitialiser les champs
        brandInput.value = "";
        colorInput.value = "";
        weightInput.value = "";
      }
    });

    // Charger les filaments de l'utilisateur connecté
    function chargerFilaments(userId) {
      const q = query(collection(db, "filaments"), where("userId", "==", userId));

      onSnapshot(q, (snapshot) => {
        filamentsList.innerHTML = "";
        snapshot.forEach((documentSnap) => {
          const data = documentSnap.data();
          const id = documentSnap.id;

          const li = document.createElement('li');
          li.innerHTML = `
            <div class="filament-info">
              <span class="filament-title">${data.brand} — ${data.type}</span>
              <span class="filament-details">Couleur : ${data.color} | Reste : ${data.weightGrams}g</span>
            </div>
            <button class="btn-danger" data-id="${id}">Supprimer</button>
          `;

          // Event listener pour supprimer
          li.querySelector('.btn-danger').addEventListener('click', async (e) => {
            const docId = e.target.getAttribute('data-id');
            await deleteDoc(doc(doc(db, "filaments", docId)));
          });

          filamentsList.appendChild(li);
        });
      });
    }
  </script>
</head>
<body>

  <div class="container">
    <h1>🧵 Stock Filaments 3D</h1>

    <!-- FORMULAIRE DE CONNEXION / INSCRIPTION -->
    <div id="auth-section" class="card">
      <h2 id="auth-title">Connexion</h2>
      <input type="email" id="email" placeholder="Adresse email">
      <input type="password" id="password" placeholder="Mot de passe">
      <button id="auth-btn">Se connecter</button>
      <button id="toggle-auth-btn" class="btn-secondary">Pas de compte ? S'inscrire</button>
      <div id="auth-error" class="error"></div>
    </div>

    <!-- APPLICATION DE GESTION -->
    <div id="app-section" class="card hidden">
      <p>Compte : <strong id="user-email"></strong></p>

      <h2 style="margin-top: 20px;">Ajouter une bobine</h2>
      <div class="grid-inputs">
        <input type="text" id="brand-input" placeholder="Marque (ex: eSUN, Elegoo)">
        <select id="type-select">
          <option value="PLA+">PLA+</option>
          <option value="PLA">PLA</option>
          <option value="PETG">PETG</option>
          <option value="TPU">TPU</option>
          <option value="ABS">ABS</option>
        </select>
      </div>
      <div class="grid-inputs">
        <input type="text" id="color-input" placeholder="Couleur (ex: Noir, Rouge)">
        <input type="number" id="weight-input" placeholder="Poids restant (g)">
      </div>
      <button id="add-filament-btn">Ajouter la bobine</button>

      <h2 style="margin-top: 25px;">Mes Bobines</h2>
      <ul id="filaments-list"></ul>

      <button id="logout-btn" class="btn-logout">Se déconnecter</button>
    </div>
  </div>

</body>
</html>
